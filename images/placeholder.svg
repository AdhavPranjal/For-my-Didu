<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE5EC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF758F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D6D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="12"/>

  <!-- Soft decorative circles -->
  <circle cx="80" cy="80" r="60" fill="#FFC2D1" opacity="0.3"/>
  <circle cx="720" cy="520" r="80" fill="#FFC2D1" opacity="0.3"/>
  <circle cx="700" cy="100" r="40" fill="#FF85A1" opacity="0.2"/>
  <circle cx="100" cy="500" r="50" fill="#FF85A1" opacity="0.2"/>

  <!-- Big heart -->
  <text x="400" y="280" font-size="100" text-anchor="middle" dominant-baseline="middle" fill="url(#heartGrad)" opacity="0.6">🌸</text>

  <!-- Camera icon placeholder -->
  <rect x="340" y="320" width="120" height="90" rx="10" fill="none" stroke="#FF4D6D" stroke-width="3" opacity="0.5"/>
  <circle cx="400" cy="365" r="22" fill="none" stroke="#FF4D6D" stroke-width="3" opacity="0.5"/>
  <rect x="360" y="330" width="30" height="10" rx="4" fill="#FF4D6D" opacity="0.5"/>

  <!-- Label -->
  <text x="400" y="445" font-size="22" text-anchor="middle" fill="#C9184A" font-family="Georgia, serif" font-weight="bold" opacity="0.8">Add Prishu's Photo Here</text>
  <text x="400" y="478" font-size="14" text-anchor="middle" fill="#A4133C" font-family="Georgia, serif" opacity="0.6">See images/README.txt for instructions</text>

  <!-- Bottom decoration dots -->
  <circle cx="370" cy="510" r="5" fill="#FF758F" opacity="0.5"/>
  <circle cx="390" cy="520" r="4" fill="#FF85A1" opacity="0.4"/>
  <circle cx="410" cy="510" r="5" fill="#FF758F" opacity="0.5"/>
  <circle cx="430" cy="520" r="4" fill="#FF85A1" opacity="0.4"/>
</svg>
